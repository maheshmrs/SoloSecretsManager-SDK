[package]
name = "solosecretsmanager"
version = "0.1.0"
description = "Read secrets from a SoloSecretsManager server in CI jobs (SEC-MACH-02)"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
ssm-core-read = { path = "../ssm-core-read" }
base64 = "0.23.1"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
x509-cert = { version = "0.3.0", default-features = false }
zeroize = "1.9.1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
hmac = "0.13.0"

[dev-dependencies]
rcgen = "0.14"
